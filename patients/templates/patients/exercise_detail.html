{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="{% static 'patients/images/favicon.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ exercise.name }} — VitalStep</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("{% static 'patients/images/main_background.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.692);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(9, 1, 79, 0.183);
            width: 700px;
            max-width: 100%;
        }
        h2 {
            color: #195293;
            text-align: center;
            margin-bottom: 20px;
        }
        .exercise-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .description {
            color: #0d3c71;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
        }
        .stage {
            color: #195293;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .video-link {
            display: inline-block;
            padding: 12px 24px;
            background: #195293;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .video-link:hover {
            background: #0e3a6e;
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            color: #195293;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ exercise.name }}</h2>

        <div style="display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
                <p class="stage">Этап: {{ exercise.get_rehab_stage_display }}</p>
                <div class="description">
                    {{ exercise.description|linebreaks }}
                </div>
            </div>

            {% if exercise.image %}
                <div style="flex: 1; min-width: 250px; text-align: center;">
                    <img src="{{ exercise.image.url }}" alt="{{ exercise.name }}" 
                        style="width: 70%; max-width: 300px;  border-color: #99b9dd; border-width: 2px; border-radius: 30px; object-fit: cover; border-style:solid;">
                </div>
            {% endif %}
        </div>

        {% if exercise.video_url %}
            <a href="{{ exercise.video_url }}" target="_blank" class="video-link">Смотреть видеоинструкцию</a>
        {% endif %}

        <br>
        <a href="{% url 'plan' %}" class="back">← Назад к плану</a>
    </div>
</body>
</html>
