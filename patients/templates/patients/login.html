{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — VitalStep</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("{% static 'patients/images/main_background.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.692);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(9, 1, 79, 0.183);
            width: 400px;
        }
        h2 {
            color: #195293;
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #195293;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #19529312;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border: 1px solid #19529366;
            box-shadow: 0 0 5px rgba(25, 82, 147, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #195293;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
        }
        button:hover {
            background: #0e3a6e;
        }
        .error {
            color: #f20651;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вход в VitalStep</h2>
        {% if form.errors %}
            <p class="error">Неверный логин или пароль</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Имя пользователя</label>
            {{ form.username }}
            <label>Пароль</label>
            {{ form.password }}
            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
